name: Nightly Release

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [i686, x86_64, aarch64]

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Build release in Docker
        uses: ./.github/actions/docker-ci
        with:
          arch: ${{ matrix.arch }}
          command: |
            make clean
            make ARCH=${{ matrix.arch }}
            if [ "${{ matrix.arch }}" != "aarch64" ]; then
              make ARCH=${{ matrix.arch }} iso
            fi

      - name: Prepare artifacts
        run: |
          mkdir -p build-artifacts
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            # aarch64 has no GRUB; deliver the ELF directly
            cp build/alloy.elf "build-artifacts/alloy-${{ matrix.arch }}.elf"
          else
            cp build/alloy.iso "build-artifacts/alloy-${{ matrix.arch }}.iso"
          fi

      - name: Upload arch artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: build-artifacts/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate Version Tag
        id: vars
        run: |
          TAG_NAME="nightly-$(date +'%Y.%m.%d')-${{ github.run_number }}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Stage release files
        run: |
          mkdir -p final-release
          for dir in release-artifacts/build-*; do
            arch="${dir#release-artifacts/build-}"
            cp "$dir"/* "final-release/"
          done
          echo "Build Date: ${{ steps.vars.outputs.date }}" > final-release/BUILD_INFO.txt
          echo "Commit: ${{ github.sha }}" >> final-release/BUILD_INFO.txt
          echo "Type: Nightly Pre-release" >> final-release/BUILD_INFO.txt
          echo "" >> final-release/BUILD_INFO.txt
          echo "Artifacts:" >> final-release/BUILD_INFO.txt
          ls -lh final-release/ >> final-release/BUILD_INFO.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Nightly Build: ${{ steps.vars.outputs.tag }}"
          body: |
            **Date:** ${{ steps.vars.outputs.date }}
            **Commit:** ${{ github.sha }}

            This is an automated pre-release build generated every 3 days.

            ## Artifacts

            | Arch | Format | Boot command |
            |---|---|---|
            | **i686** | `alloy-i686.iso` | `qemu-system-i386 -cdrom alloy-i686.iso -serial stdio` |
            | **x86_64** | `alloy-x86_64.iso` | `qemu-system-x86_64 -cdrom alloy-x86_64.iso -serial stdio` |
            | **aarch64** | `alloy-aarch64.elf` | `qemu-system-aarch64 -machine virt -cpu cortex-a53 -kernel alloy-aarch64.elf -serial stdio` |
          generate_release_notes: true
          draft: false
          prerelease: true
          files: |
            final-release/alloy-*.iso
            final-release/alloy-*.elf
            final-release/BUILD_INFO.txt
