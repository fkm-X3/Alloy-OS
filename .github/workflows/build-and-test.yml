name: Build and Test Kernel

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Cache Rust target directories
      uses: actions/cache@v4
      with:
        path: |
          kernel/rust/target
          Alloy-DE/alloy-display-kernel/target
        key: cargo-target-${{ runner.os }}-${{ hashFiles('kernel/rust/Cargo.lock', 'kernel/rust/Cargo.toml', 'Alloy-DE/alloy-display-kernel/Cargo.toml', 'Dockerfile', 'build-toolchain.sh') }}
        restore-keys: |
          cargo-target-${{ runner.os }}-

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase image tag
      id: set-image
      run: echo "image-tag=ghcr.io/${GITHUB_REPOSITORY,,}-ci:latest" >> $GITHUB_OUTPUT

    - name: Build kernel
      uses: ./.github/actions/docker-ci
      with:
        pull: false
        image-tag: ${{ steps.set-image.outputs.image-tag }}
        command: |
          make
          make iso

    - name: Verify build artifacts
      if: always()
      run: |
        echo "Checking build artifacts..."
        ls -lh build/
        if [ ! -f "build/alloy.elf" ]; then
          echo "ERROR: Kernel ELF not found!"
          exit 1
        fi
        if [ ! -f "build/alloy.iso" ]; then
          echo "ERROR: Kernel ISO not found!"
          exit 1
        fi
        echo "Build artifacts verified!"
        file build/alloy.elf
        file build/alloy.iso

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          build/alloy.elf
          build/alloy.iso
        retention-days: 7

  boot-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: kernel-build
        path: ${{ github.workspace }}

    - name: List workspace contents
      run: find ${{ github.workspace }} -name '*.iso' -o -name '*.elf' 2>/dev/null | head -20

    - name: Install QEMU
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86

    - name: Boot test
      run: |
        echo "Testing kernel boot..."
        test -f build/alloy.iso && echo "ISO found" || echo "ISO NOT FOUND"
        timeout 60s qemu-system-i386 \
          -cdrom build/alloy.iso \
          -serial file:serial.log \
          -display none \
          -no-reboot \
          -no-shutdown \
          -D qemu.log || true
        echo "=== serial.log ==="
        cat serial.log 2>/dev/null || echo "(file not found or empty)"
        echo "=== qemu.log ==="
        cat qemu.log 2>/dev/null || echo "(file not found or empty)"

    - name: Verify boot success
      if: always()
      run: |
        if [ ! -f "serial.log" ] || [ ! -s "serial.log" ]; then
          echo "ERROR: No serial output found!"
          exit 1
        fi
        echo "=== Boot log ==="
        head -100 serial.log
        echo "... (truncated) ..."
        tail -50 serial.log
        if ! grep -q "Alloy" serial.log; then
          echo "ERROR: Kernel name not found"
          cat serial.log
          exit 1
        fi
        if ! grep -qE "GDT|IDT|PMM|VMM" serial.log; then
          echo "ERROR: Init messages not found"
          cat serial.log
          exit 1
        fi
        echo "Boot verification passed!"

    - name: Upload boot logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: boot-logs
        path: |
          serial.log
          qemu.log
        retention-days: 7
