name: Build Docker CI Image

on:
  push:
    branches: [ main, develop ]
    paths: [ Dockerfile, build-toolchain.sh ]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
    
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
    
      - name: Set lowercase image tag
        run: echo "CI_IMAGE=${GITHUB_REPOSITORY,,}-ci" >> $GITHUB_ENV
    
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.CI_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
