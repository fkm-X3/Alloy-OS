name: Scheduled Nightly Release

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Generate Version Tag
        id: vars
        run: |
          TAG_NAME="nightly-$(date +'%Y.%m.%d')-${{ github.run_number }}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            kernel/rust/target/
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'Alloy-DE/**/Cargo.lock', 'Alloy-DE/**/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Build release in Docker
        uses: ./.github/actions/docker-ci
        with:
          command: |
            make clean
            make iso

      - name: Prepare Artifacts
        run: |
          mkdir -p build-artifacts
          cp build/alloy.iso build-artifacts/alloy.iso
          echo "Build Date: ${{ steps.vars.outputs.date }}" > build-artifacts/BUILD_INFO.txt
          echo "Commit: ${{ github.sha }}" >> build-artifacts/BUILD_INFO.txt
          echo "Type: Nightly Pre-release" >> build-artifacts/BUILD_INFO.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Nightly Build: ${{ steps.vars.outputs.tag }}"
          body: |
            **Date:** ${{ steps.vars.outputs.date }}
            **Commit:** ${{ github.sha }}

            This is an automated pre-release build generated every 3 days.

            ```bash
            qemu-system-i386 -cdrom alloy.iso -serial stdio
            ```
          generate_release_notes: true #
          draft: false
          prerelease: true
          files: |
            build-artifacts/alloy.iso
            build-artifacts/BUILD_INFO.txt