name: Alloy OS Docker CI
description: Build or pull an arch-specific Alloy OS Docker image and run a command inside it.

inputs:
  arch:
    description: Target architecture (x86_64, aarch64)
    required: false
    default: x86_64
  command:
    description: Command to run inside the container
    required: true
  image-tag:
    description: Docker image tag (defaults to alloy-os-ci-<arch>)
    required: false
    default: ''
  pull:
    description: Pull pre-built image from GHCR instead of building locally
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Resolve image tag
      shell: bash
      run: |
        if [ -z "${{ inputs.image-tag }}" ]; then
          echo "IMAGE_TAG=alloy-os-ci-${{ inputs.arch }}" >> $GITHUB_ENV
        else
          echo "IMAGE_TAG=${{ inputs.image-tag }}" >> $GITHUB_ENV
        fi

    - name: Set up Docker Buildx
      if: inputs.pull != 'true'
      uses: docker/setup-buildx-action@v4
      with:
        driver: docker-container

    - name: Cache Docker layers
      if: inputs.pull != 'true'
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: docker-${{ runner.os }}-${{ inputs.arch }}-${{ hashFiles(format('Dockerfile.{0}', inputs.arch), 'build-toolchain.sh') }}
        restore-keys: |
          docker-${{ runner.os }}-${{ inputs.arch }}-

    - name: Build image
      if: inputs.pull != 'true'
      shell: bash
      run: |
        set -euo pipefail
        docker buildx build --load \
          --cache-from=type=local,src=/tmp/.buildx-cache \
          --cache-to=type=local,dest=/tmp/.buildx-cache-new,mode=max \
          -t "$IMAGE_TAG" \
          -f Dockerfile.${{ inputs.arch }} .
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Pull image
      if: inputs.pull == 'true'
      shell: bash
      run: docker pull "$IMAGE_TAG"

    - name: Run command
      shell: bash
      env:
        DOCKER_COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail

        cd "$GITHUB_WORKSPACE"
        mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"

        docker run --rm \
          -e HOME=/root \
          -e CARGO_HOME=/root/.cargo \
          -e RUSTUP_HOME=/root/.rustup \
          -e DOCKER_COMMAND \
          -v "$GITHUB_WORKSPACE:/workspace" \
          -v "$HOME/.cargo/registry:/root/.cargo/registry" \
          -v "$HOME/.cargo/git:/root/.cargo/git" \
          -w /workspace \
          "$IMAGE_TAG" \
          bash -lc 'set -euo pipefail; eval "$DOCKER_COMMAND"'
