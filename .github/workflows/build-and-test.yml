name: Build and Test Kernel

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Cache Rust dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          kernel/rust/target/
        key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'Alloy-DE/**/Cargo.lock', 'Alloy-DE/**/Cargo.toml') }}
        restore-keys: |
          rust-${{ runner.os }}-

    - name: Build and test in Docker
      uses: ./.github/actions/docker-ci
      with:
        command: |
          make clean
          make
          make iso

          echo "Testing kernel boot..."
          timeout 60s qemu-system-i386 \
            -cdrom build/alloy.iso \
            -serial file:serial.log \
            -display none \
            -no-reboot \
            -no-shutdown \
            -D qemu.log || true

    - name: Show boot logs
      if: always()
      run: |
        echo "=== QEMU Log ==="
        cat qemu.log || echo "No QEMU log found"

        echo "=== Serial Log ==="
        cat serial.log || echo "No serial log found"
    
    - name: Verify build artifacts
      run: |
        echo "Checking build artifacts..."
        ls -lh build/
        
        if [ ! -f "build/alloy.elf" ]; then
          echo "ERROR: Kernel ELF not found!"
          exit 1
        fi
        
        if [ ! -f "build/alloy.iso" ]; then
          echo "ERROR: Kernel ISO not found!"
          exit 1
        fi
        
        echo "Build artifacts verified!"
        file build/alloy.elf
        file build/alloy.iso
    
    - name: Verify boot success
      run: |
        echo "Verifying kernel boot..."
        
        if [ ! -f "serial.log" ] || [ ! -s "serial.log" ]; then
          echo "ERROR: No serial output found!"
          exit 1
        fi
        
        echo "=== Full serial log ==="
        head -100 serial.log
        echo "..."
        tail -50 serial.log
        
        # Check for key boot messages
        if grep -q "Alloy" serial.log; then
          echo "Kernel name found"
        else
          echo "Kernel name not found"
          echo "Serial log contents:"
          cat serial.log
          exit 1
        fi
        
        if grep -qE "GDT|IDT|PMM|VMM" serial.log; then
          echo "Initialization messages found"
        else
          echo "Initialization messages not found"
          echo "Serial log contents:"
          cat serial.log
          exit 1
        fi
        
        # Check for Rust entry
        if grep -q "rust_main\|Rust" serial.log; then
          echo "Rust layer initialized"
        else
          echo "Rust layer not detected (may be normal)"
        fi
        
        echo "Boot verification passed!"
    
    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: kernel-build
        path: |
          build/alloy.elf
          build/alloy.iso
          serial.log
          qemu.log
        retention-days: 7
    
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: failure-logs
        path: |
          serial.log
          qemu.log
          build/
        retention-days: 14
