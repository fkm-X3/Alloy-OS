[package]
name = "alloy-kernel-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[features]
default = ["x86_64"]
x86_64 = ["alloy-kernel-hal/x86_64"]
aarch64 = ["alloy-kernel-hal/aarch64"]
ported = ["alloy-kernel-hal/ported"]
debug-alloc = []

[dependencies]
alloy-kernel-hal = { path = "../hal", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 2
