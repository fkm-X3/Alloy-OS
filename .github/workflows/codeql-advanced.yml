name: Advanced CodeQL Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: python
            build-mode: none

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Install system dependencies
        if: matrix.language == 'cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            wget \
            tar \
            bison \
            flex \
            libgmp3-dev \
            libmpc-dev \
            libmpfr-dev \
            texinfo

      - name: Cache cross-compiler
        if: matrix.language == 'cpp'
        id: cache-cross-compiler
        uses: actions/cache@v4
        with:
          path: ~/.local/i686-elf
          key: i686-elf-gcc-${{ runner.os }}-codeql-v1

      - name: Build cross-compiler
        if: matrix.language == 'cpp' && steps.cache-cross-compiler.outputs.cache-hit != 'true'
        run: |
          chmod +x build-toolchain.sh
          ./build-toolchain.sh

      - name: Install Rust nightly
        if: matrix.language == 'cpp'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache Rust dependencies
        if: matrix.language == 'cpp'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            kernel/rust/target/
          key: rust-${{ runner.os }}-codeql-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-codeql-

      - name: Set PATH
        if: matrix.language == 'cpp'
        run: echo "$HOME/.local/i686-elf/bin" >> "$GITHUB_PATH"

      - name: Build kernel for CodeQL
        if: matrix.language == 'cpp'
        run: |
          make clean
          make

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
