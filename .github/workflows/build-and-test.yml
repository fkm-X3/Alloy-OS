name: Build and Test Kernel

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  CI_IMAGE: ${{ lower(github.repository) }}-ci:latest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Cache Rust target directories
      uses: actions/cache@v4
      with:
        path: |
          kernel/rust/target
          Alloy-DE/alloy-display-kernel/target
        key: cargo-target-${{ runner.os }}-${{ hashFiles('kernel/rust/Cargo.lock', 'kernel/rust/Cargo.toml', 'Alloy-DE/alloy-display-kernel/Cargo.toml', 'Dockerfile', 'build-toolchain.sh') }}
        restore-keys: |
          cargo-target-${{ runner.os }}-

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build kernel
      uses: ./.github/actions/docker-ci
      with:
        pull: true
        image-tag: ${{ env.REGISTRY }}/${{ env.CI_IMAGE }}
        command: |
          make
          make iso

    - name: Verify build artifacts
      if: always()
      run: |
        echo "Checking build artifacts..."
        ls -lh build/
        if [ ! -f "build/alloy.elf" ]; then
          echo "ERROR: Kernel ELF not found!"
          exit 1
        fi
        if [ ! -f "build/alloy.iso" ]; then
          echo "ERROR: Kernel ISO not found!"
          exit 1
        fi
        echo "Build artifacts verified!"
        file build/alloy.elf
        file build/alloy.iso

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          build/alloy.elf
          build/alloy.iso
        retention-days: 7

  boot-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: kernel-build

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Boot test in Docker
      uses: ./.github/actions/docker-ci
      with:
        pull: true
        image-tag: ${{ env.REGISTRY }}/${{ env.CI_IMAGE }}
        command: |
          echo "Testing kernel boot..."
          timeout 20s qemu-system-i386 \
            -cdrom build/alloy.iso \
            -serial file:serial.log \
            -display none \
            -no-reboot \
            -no-shutdown \
            -D qemu.log || true

    - name: Verify boot success
      if: always()
      run: |
        if [ ! -f "serial.log" ] || [ ! -s "serial.log" ]; then
          echo "ERROR: No serial output found!"
          exit 1
        fi
        echo "=== Boot log ==="
        head -100 serial.log
        echo "... (truncated) ..."
        tail -50 serial.log
        if ! grep -q "Alloy" serial.log; then
          echo "ERROR: Kernel name not found"
          cat serial.log
          exit 1
        fi
        if ! grep -qE "GDT|IDT|PMM|VMM" serial.log; then
          echo "ERROR: Init messages not found"
          cat serial.log
          exit 1
        fi
        echo "Boot verification passed!"

    - name: Upload boot logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: boot-logs
        path: |
          serial.log
          qemu.log
        retention-days: 7
