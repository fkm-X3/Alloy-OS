name: Update Desktop Shell Screenshot

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-screenshot:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Need full history for diff
        submodules: recursive

    - name: Cache Rust dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          kernel/rust/target/
        key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'Alloy-DE/**/Cargo.lock', 'Alloy-DE/**/Cargo.toml') }}
        restore-keys: |
          rust-${{ runner.os }}-

    - name: Build screenshot in Docker
      uses: ./.github/actions/docker-ci
      with:
        command: |
          make clean
          make
          make iso
          python3 tools/capture_desktop_screenshot.py --iso build/alloy.iso --output assets/desktop-shell-grid.png --serial-log build/desktop-shell-boot.log --qemu-log build/qemu-screenshot.log --settle-seconds 5

    - name: Check if image changed
      id: check
      run: |
        if git diff --quiet assets/desktop-shell-grid.png; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push if changed
      if: steps.check.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add assets/desktop-shell-grid.png
        git commit -m "Update desktop-shell-grid.png [skip ci]"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
