name: Build and Test Kernel

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Build and test in Docker
      uses: ./.github/actions/docker-ci
      with:
        command: |
          make clean
          make
          make iso

          echo "Testing kernel boot..."
          timeout 60s qemu-system-i386 \
            -cdrom build/alloy.iso \
            -serial file:serial.log \
            -display none \
            -no-reboot \
            -no-shutdown \
            -D qemu.log || true

    - name: Verify build artifacts
      if: always()
      run: |
        echo "Checking build artifacts..."
        ls -lh build/
        if [ ! -f "build/alloy.elf" ]; then
          echo "ERROR: Kernel ELF not found!"
          exit 1
        fi
        if [ ! -f "build/alloy.iso" ]; then
          echo "ERROR: Kernel ISO not found!"
          exit 1
        fi
        echo "Build artifacts verified!"
        file build/alloy.elf
        file build/alloy.iso
    
    - name: Verify boot success
      if: always()
      run: |
        if [ ! -f "serial.log" ] || [ ! -s "serial.log" ]; then
          echo "ERROR: No serial output found!"
          exit 1
        fi
        echo "=== Boot log ==="
        head -100 serial.log
        echo "... (truncated) ..."
        tail -50 serial.log
        if ! grep -q "Alloy" serial.log; then
          echo "ERROR: Kernel name not found"
          cat serial.log
          exit 1
        fi
        if ! grep -qE "GDT|IDT|PMM|VMM" serial.log; then
          echo "ERROR: Init messages not found"
          cat serial.log
          exit 1
        fi
        echo "Boot verification passed!"
    
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          build/alloy.elf
          build/alloy.iso
          serial.log
          qemu.log
        retention-days: 7
