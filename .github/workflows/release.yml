name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Cache Rust dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          kernel/rust/target/
        key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'Alloy-DE/**/Cargo.lock', 'Alloy-DE/**/Cargo.toml') }}
        restore-keys: |
          rust-${{ runner.os }}-
    
    - name: Build release in Docker
      uses: ./.github/actions/docker-ci
      with:
        command: |
          make clean
          make iso
          echo "Build Date: $(date)" > build/BUILD_INFO.txt
          echo "Commit: ${{ github.sha }}" >> build/BUILD_INFO.txt
          echo "Tag: ${{ github.ref_name }}" >> build/BUILD_INFO.txt
          cat build/BUILD_INFO.txt
    
    - name: Create release archive
      run: |
        cd build
        tar -czf alloy-os-${{ github.ref_name }}.tar.gz alloy.iso alloy.elf BUILD_INFO.txt
        sha256sum alloy-os-${{ github.ref_name }}.tar.gz > alloy-os-${{ github.ref_name }}.tar.gz.sha256
    
    - name: Upload release artifacts
      uses: actions/upload-artifact@v7
      with:
        name: alloy-os-release
        path: |
          build/alloy.iso
          build/alloy.elf
          build/alloy-os-*.tar.gz
          build/alloy-os-*.tar.gz.sha256
          build/BUILD_INFO.txt
        retention-days: 90
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          build/alloy.iso
          build/alloy-os-*.tar.gz
          build/alloy-os-*.tar.gz.sha256
          build/BUILD_INFO.txt
        body: |
          # Alloy OS ${{ github.ref_name }}
          
          ## Downloads
          - `alloy.iso` - Bootable ISO image
          - `alloy-os-${{ github.ref_name }}.tar.gz` - Complete release package
          
          ## Checksums
          See `alloy-os-${{ github.ref_name }}.tar.gz.sha256` for SHA256 checksum
          
          ## Running
          ```bash
          qemu-system-i386 -cdrom alloy.iso -serial stdio
          ```
        draft: false
        prerelease: false
