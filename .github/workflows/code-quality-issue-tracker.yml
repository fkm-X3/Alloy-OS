name: Code Quality Issue Tracker

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            kernel/rust/target/
          key: rust-${{ runner.os }}-quality-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'Alloy-DE/**/Cargo.lock', 'Alloy-DE/**/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-quality-

      - name: Run code quality analysis
        uses: ./.github/actions/docker-ci
        with:
          command: |
            set -euo pipefail

            # Rust clippy analysis
            echo "=== Running clippy ==="
            cd /workspace/kernel/rust
            cargo +nightly clippy \
              --target i686-alloy.json \
              -Zbuild-std=core,alloc \
              -Zjson-target-spec \
              2>&1 | tee /workspace/clippy_output.txt
            exit_code=$?
            cd /workspace
            if [ $exit_code -ne 0 ] && [ $exit_code -ne 101 ]; then
              exit $exit_code
            fi
            cd /workspace

            # Extract clippy counts from output
            CLIPPY_ERRORS=$(grep -c '^error' clippy_output.txt || echo 0)
            CLIPPY_WARNINGS=$(grep -c 'warning:' clippy_output.txt || echo 0)

            # Count TODO / FIXME / HACK / XXX across source tree
            TODO_COUNT=$(grep -rn 'TODO' \
              kernel/ boot/ \
              --include='*.rs' --include='*.c' --include='*.h' --include='*.asm' \
              2>/dev/null | wc -l)

            FIXME_COUNT=$(grep -rn 'FIXME' \
              kernel/ boot/ \
              --include='*.rs' --include='*.c' --include='*.h' --include='*.asm' \
              2>/dev/null | wc -l)

            HACK_COUNT=$(grep -rn 'HACK\|XXX' \
              kernel/ \
              --include='*.rs' --include='*.c' --include='*.h' \
              2>/dev/null | wc -l)

            # Null / nullptr patterns in C code
            NULL_COUNT=$(grep -rn 'NULL\|nullptr' \
              kernel/c/ \
              --include='*.c' --include='*.h' \
              2>/dev/null | wc -l)

            # Count unsafe blocks in the Rust entry point
            UNSAFE_COUNT=$(grep -c 'unsafe' \
              /workspace/kernel/rust/src/lib.rs \
              2>/dev/null || echo 0)

            # Write results to a file in the mounted workspace
            cat > /workspace/quality.env <<EOF
            CLIPPY_ERRORS=$CLIPPY_ERRORS
            CLIPPY_WARNINGS=$CLIPPY_WARNINGS
            TODO_COUNT=$TODO_COUNT
            FIXME_COUNT=$FIXME_COUNT
            HACK_COUNT=$HACK_COUNT
            NULL_COUNT=$NULL_COUNT
            UNSAFE_COUNT=$UNSAFE_COUNT
            EOF

            echo "=== Results ==="
            cat /workspace/quality.env

      - name: Load quality results
        id: quality
        uses: ./.github/actions/docker-ci
        with:
          command: cat /workspace/quality.env >> "$GITHUB_OUTPUT"

      - name: Check thresholds
        id: threshold
        run: |
          SHOULD_CREATE=false
          if [ "${{ steps.quality.outputs.CLIPPY_ERRORS }}" -gt 0 ]; then
            echo "Clippy errors detected" && SHOULD_CREATE=true
          fi
          if [ "${{ steps.quality.outputs.CLIPPY_WARNINGS }}" -gt 0 ]; then
            echo "Clippy warnings detected" && SHOULD_CREATE=true
          fi
          if [ "${{ steps.quality.outputs.FIXME_COUNT }}" -gt 10 ]; then
            echo "FIXME threshold exceeded" && SHOULD_CREATE=true
          fi
          echo "should_create=$SHOULD_CREATE" >> "$GITHUB_OUTPUT"

      - name: Create / update issue
        if: steps.threshold.outputs.should_create == 'true'
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          CLIPPY_ERRORS: ${{ steps.quality.outputs.CLIPPY_ERRORS }}
          CLIPPY_WARNINGS: ${{ steps.quality.outputs.CLIPPY_WARNINGS }}
          TODO_COUNT: ${{ steps.quality.outputs.TODO_COUNT }}
          FIXME_COUNT: ${{ steps.quality.outputs.FIXME_COUNT }}
          HACK_COUNT: ${{ steps.quality.outputs.HACK_COUNT }}
          NULL_COUNT: ${{ steps.quality.outputs.NULL_COUNT }}
          UNSAFE_COUNT: ${{ steps.quality.outputs.UNSAFE_COUNT }}
        with:
          filename: .github/ISSUE_TEMPLATE/code-quality-report.md
          update_existing: true
          search_existing: all
