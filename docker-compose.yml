services:
  alloy:
    build:
      context: .
      dockerfile: Dockerfile.${ALLOY_ARCH:-x86_64}
    image: alloy-os-dev-${ALLOY_ARCH:-x86_64}
    working_dir: /workspace
    environment:
      HOME: /root
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - .:/workspace
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - /tmp/.X11-unix:/tmp/.X11-unix
    stdin_open: true
    tty: true
    user: root
    command: bash

volumes:
  cargo-registry:
  cargo-git:
