services:
  alloy:
    build:
      context: .
      dockerfile: Dockerfile
    image: alloy-os-dev
    working_dir: /workspace
    environment:
      HOME: /root
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    volumes:
      - .:/workspace
      - i686-elf-cache:/root/.local/i686-elf
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
    stdin_open: true
    tty: true
    user: root
    command: bash

volumes:
  i686-elf-cache:
  cargo-registry:
  cargo-git:
