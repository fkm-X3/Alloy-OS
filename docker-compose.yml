services:
  alloy:
    build:
      context: .
      dockerfile: Dockerfile.${ALLOY_ARCH:-x86_64}
    image: alloy-os-dev-${ALLOY_ARCH:-x86_64}
    working_dir: /workspace
    environment:
      HOME: /root
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    volumes:
      - .:/workspace
      - x86_64-elf-cache:/root/.local/x86_64-elf
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
    stdin_open: true
    tty: true
    user: root
    command: bash

volumes:
  x86_64-elf-cache:
  cargo-registry:
  cargo-git:
