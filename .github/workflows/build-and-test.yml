name: Build and Test Kernel

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Cache Rust target directories
      uses: actions/cache@v5
      with:
        path: |
          kernel/rust/target
        key: cargo-target-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('kernel/rust/Cargo.lock', 'kernel/rust/Cargo.toml', format('Dockerfile.{0}', matrix.arch), 'build-toolchain.sh') }}
        restore-keys: |
          cargo-target-${{ runner.os }}-

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase image tag
      id: set-image
      run: echo "image-tag=ghcr.io/${GITHUB_REPOSITORY,,}-ci-${{ matrix.arch }}:latest" >> $GITHUB_OUTPUT

    - name: Build kernel (${{ matrix.arch }})
      uses: ./.github/actions/docker-ci
      with:
        arch: ${{ matrix.arch }}
        pull: false
        image-tag: ${{ steps.set-image.outputs.image-tag }}
        command: |
          make ARCH=${{ matrix.arch }}
          if [ "${{ matrix.arch }}" != "aarch64" ]; then
            make ARCH=${{ matrix.arch }} iso
          fi

    - name: Verify build artifacts
      if: always()
      run: |
        echo "Checking build artifacts..."
        ls -lh build/
        if [ ! -f "build/alloy.elf" ]; then
          echo "ERROR: Kernel ELF not found!"
          exit 1
        fi
        if [ "${{ matrix.arch }}" != "aarch64" ] && [ ! -f "build/alloy.iso" ]; then
          echo "ERROR: Kernel ISO not found!"
          exit 1
        fi
        echo "Build artifacts verified!"
        file build/alloy.elf

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: kernel-build-${{ matrix.arch }}
        path: |
          build/alloy.elf
          build/alloy.iso*
        retention-days: 7

  boot-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: kernel-build-${{ matrix.arch }}
        path: ${{ github.workspace }}

    - name: List workspace contents
      run: find ${{ github.workspace }} -name '*.iso' -o -name '*.elf' 2>/dev/null | head -20

    - name: Install QEMU
      run: |
        sudo apt-get update
        if [ "${{ matrix.arch }}" = "aarch64" ]; then
          sudo apt-get install -y --no-install-recommends qemu-system-aarch64 qemu-efi-aarch64 ipxe-qemu
        else
          sudo apt-get install -y --no-install-recommends qemu-system-x86
        fi

    - name: Boot test (${{ matrix.arch }})
      run: |
        echo "Testing kernel boot (${{ matrix.arch }})..."
        echo "Current directory: $(pwd)"
        echo "Workspace: ${{ github.workspace }}"
        echo "QEMU version: $(qemu-system-aarch64 --version 2>/dev/null || qemu-system-i386 --version 2>/dev/null || true)"

        rm -f serial.log qemu.log qemu_stderr.log

        if [ "${{ matrix.arch }}" = "aarch64" ]; then
          # aarch64: boot ELF directly to avoid CI firmware ROM dependency issues
          ELF_FILE=$(find ${{ github.workspace }} -name "alloy.elf" -type f | head -1)
          if [ -z "$ELF_FILE" ]; then
            echo "ERROR: alloy.elf not found!"
            find ${{ github.workspace }} -type f -name "*.elf" | head -20
            exit 1
          fi
          echo "Found ELF: $ELF_FILE"
          file "$ELF_FILE"
          ls -lh "$ELF_FILE"

          set +e
          timeout 60s qemu-system-aarch64 \
            -machine virt -cpu cortex-a53 \
            -kernel "$ELF_FILE" \
            -serial file:serial.log \
            -display none \
            -no-reboot \
            -D qemu.log 2>qemu_stderr.log
          QEMU_EXIT=$?
          set -e
          echo "QEMU exit code: $QEMU_EXIT"
        else
          # x86 arches boot via ISO
          ISO_FILE=$(find ${{ github.workspace }} -name "alloy.iso" -type f | head -1)
          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: alloy.iso not found!"
            find ${{ github.workspace }} -type f -name "*.iso" | head -20
            exit 1
          fi
          echo "Found ISO: $ISO_FILE"
          file "$ISO_FILE"
          ls -lh "$ISO_FILE"

          QEMU_BIN="qemu-system-x86_64"

          set +e
          timeout 60s "$QEMU_BIN" \
            -cdrom "$ISO_FILE" \
            -serial file:serial.log \
            -display none \
            -no-reboot \
            -D qemu.log 2>qemu_stderr.log
          QEMU_EXIT=$?
          set -e
          echo "QEMU exit code: $QEMU_EXIT"
        fi

        echo "=== qemu_stderr.log ==="
        cat qemu_stderr.log 2>/dev/null || echo "(file not found)"
        echo "=== qemu.log ==="
        tail -50 qemu.log 2>/dev/null || echo "(file not found or empty)"
        echo "=== serial.log ==="
        cat serial.log 2>/dev/null || echo "(file not found or empty)"

    - name: Verify boot success
      if: always()
      run: |
        echo "=== Boot log (${{ matrix.arch }}) ==="
        if [ -f "serial.log" ] && [ -s "serial.log" ]; then
          head -100 serial.log
          echo "... (truncated) ..."
          tail -50 serial.log
        fi

        if [ ! -f "serial.log" ] || [ ! -s "serial.log" ]; then
          echo "ERROR: No serial output found!"
          if [ -f "qemu_stderr.log" ] && [ -s "qemu_stderr.log" ]; then
            echo "QEMU stderr:"
            cat qemu_stderr.log
          fi
          if [ -f "qemu.log" ] && [ -s "qemu.log" ]; then
            echo "QEMU debug log:"
            cat qemu.log
          fi
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            echo ""
            echo "Possible fixes:"
            echo "  - Ensure qemu-system-aarch64 supports -machine virt -cpu cortex-a53"
            echo "  - Verify the ELF is a valid aarch64 binary (file build/alloy.elf)"
            echo "  - Install ipxe-qemu (provides efi-virtio.rom for virtio PCI option ROM)"
          fi
          exit 1
        fi

        if ! grep -q "Alloy" serial.log; then
          echo "ERROR: Kernel name not found in serial output"
          cat serial.log
          exit 1
        fi

        case "${{ matrix.arch }}" in
          aarch64)
            if ! grep -qE "GDT|IDT|PMM|VMM|PL110|Generic Timer" serial.log; then
              echo "ERROR: ARM init messages not found"
              cat serial.log
              exit 1
            fi
            ;;
          x86_64)
            # Accept either detailed init logs (GDT/IDT/PMM/VMM) or early boot markers
            if ! grep -qE "GDT|IDT|PMM|VMM|Entered 64-bit long mode|Multiboot2 magic verified|Alloy Kernel Booting|Architecture: x86_64" serial.log; then
              echo "ERROR: x86 boot/init messages not found"
              cat serial.log
              exit 1
            fi
            ;;
        esac

        echo "Boot verification passed for ${{ matrix.arch }}!"

    - name: Upload boot logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: boot-logs-${{ matrix.arch }}
        path: |
          serial.log
          qemu.log
        retention-days: 7