name: Build Qt6 for Alloy OS

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version to build'
        required: false
        default: '6.4.2'

env:
  QT_VERSION: ${{ github.event.inputs.qt_version || '6.4.2' }}

jobs:
  build-qt6:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            perl \
            python3 \
            pkg-config \
            libclang-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxcb-*-dev \
            libwayland-dev

      - name: Build Qt6
        run: |
          JOBS=$(nproc) ./tools/build-qt6.sh

      - name: Verify archive
        run: |
          ls -lh deps/qt6-alloy-x86_64.tar.gz
          echo "Archive contents:"
          tar tzf deps/qt6-alloy-x86_64.tar.gz | head -20

      - name: Commit updated Qt6 archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deps/qt6-alloy-x86_64.tar.gz
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "deps: update Qt6 ${QT_VERSION} archive [skip ci]"
          git push
