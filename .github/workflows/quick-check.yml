name: Quick Check

on:
  pull_request:
    branches: [ main, develop ]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Cache Rust dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          kernel/rust/target/
        key: rust-${{ runner.os }}-quick-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          rust-${{ runner.os }}-quick-

    - name: Syntax checks in Docker
      uses: ./.github/actions/docker-ci
      with:
        command: |
          echo "Checking assembly files..."
          for asm_file in $(find . -name "*.asm"); do
            echo "Checking $asm_file"
            nasm -f elf32 -o /dev/null "$asm_file"
          done
          echo "All assembly files are valid!"

          echo "Building userland binaries (needed by Rust include_bytes!)..."
          make -C os/userland
          cp os/userland/build/hello hello 2>/dev/null || true
          cp os/userland/build/compositor compositor 2>/dev/null || true

          cd kernel/rust
          cargo +nightly fmt --check || echo "Formatting issues found (non-blocking)"
          cargo +nightly clippy --target i686-alloy.json -Zbuild-std=core,alloc || echo "Clippy warnings found (non-blocking)"
