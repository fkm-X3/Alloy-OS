name: Quick Check

on:
  pull_request:
    branches: [ main, develop ]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nasm-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Check NASM assembly files
      uses: ./.github/actions/docker-ci
      with:
        arch: x86_64
        command: |
          echo "=== Checking NASM (.asm) files ==="
          for asm_file in $(find . -name "*.asm"); do
            echo "Checking $asm_file"
            nasm -f elf64 -o /dev/null "$asm_file"
          done
          echo "All NASM files are valid!"

  gas-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Check GAS assembly files
      uses: ./.github/actions/docker-ci
      with:
        arch: aarch64
        command: |
          echo "=== Checking GAS (.S) files ==="
          for s_file in $(find . -name "*.S"); do
            echo "Checking $s_file"
            aarch64-linux-gnu-gcc -c -march=armv8-a -o /dev/null "$s_file"
          done
          echo "All GAS files are valid!"

  clippy:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Cache Rust dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          kernel/rust/target/
        key: rust-${{ runner.os }}-quick-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          rust-${{ runner.os }}-quick-${{ matrix.arch }}-

    - name: Syntax checks in Docker (${{ matrix.arch }})
      uses: ./.github/actions/docker-ci
      with:
        arch: ${{ matrix.arch }}
        command: |
          echo "Building userland binaries (needed by Rust include_bytes!)..."
          make -C os/userland
          cp os/userland/build/hello hello 2>/dev/null || true
          cp os/userland/build/compositor compositor 2>/dev/null || true

          cd kernel/rust
          cargo +nightly fmt --check || echo "Formatting issues found (non-blocking)"
          cargo +nightly clippy --target ${{ matrix.arch }}-alloy.json -Zbuild-std=core,alloc || echo "Clippy warnings found (non-blocking)"
