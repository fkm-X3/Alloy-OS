name: Quick Check

on:
  pull_request:
    branches: [ main, develop ]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nasm-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Check NASM assembly files
      uses: ./.github/actions/docker-ci
      with:
        arch: x86_64
        command: |
          echo "=== Checking NASM (.asm) files ==="
          for asm_file in $(find boot kernel/asm -name "*.asm"); do
            echo "Checking $asm_file"
            nasm -f elf64 -o /dev/null "$asm_file"
          done
          echo "All NASM files are valid!"

  gas-check-aarch64:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Check aarch64 GAS assembly files
      uses: ./.github/actions/docker-ci
      with:
        arch: aarch64
        command: |
          echo "=== Checking aarch64 GAS (.S) files ==="
          for s_file in $(find boot kernel/asm -name "*.S"); do
            echo "Checking $s_file"
            aarch64-linux-gnu-gcc -c -march=armv8-a -o /dev/null "$s_file"
          done
          echo "All aarch64 GAS files are valid!"

  clippy:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Cache Rust dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          kernel/unsafe-core/target/
          kernel/hal/target/
          kernel/rust/target/
        key: rust-${{ runner.os }}-quick-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          rust-${{ runner.os }}-quick-${{ matrix.arch }}-

    - name: Syntax checks in Docker (${{ matrix.arch }})
      uses: ./.github/actions/docker-ci
      with:
        arch: ${{ matrix.arch }}
        command: |
          echo "Building userland binaries (needed by Rust include_bytes!)..."
          export ARCH=${{ matrix.arch }}
          cargo xtask userland

          # All three crates, each with the matching arch feature (defaults are
          # x86_64-only, so --no-default-features is what makes this a real
          # aarch64 check).
          for crate_dir in kernel/unsafe-core kernel/hal kernel/rust; do
            echo "=== $crate_dir fmt (${{ matrix.arch }}) ==="
            cargo +nightly fmt --check --manifest-path "$crate_dir/Cargo.toml" \
              || echo "Formatting issues found in $crate_dir (non-blocking)"
            echo "=== $crate_dir clippy (${{ matrix.arch }}) ==="
            cargo +nightly clippy \
                --manifest-path "$crate_dir/Cargo.toml" \
                --target kernel/rust/${{ matrix.arch }}-alloy.json \
                -Zbuild-std=core,alloc -Zjson-target-spec \
                --no-default-features --features ${{ matrix.arch }} \
              || echo "Clippy warnings found in $crate_dir (non-blocking)"
          done
